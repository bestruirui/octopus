<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eae9e3" />
    <meta name="application-name" content="Octopus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Octopus" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-title" content="Octopus" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-icon.png" />
    <title>Octopus</title>
    <script>
      const theme = localStorage.getItem('theme');
      const isDark =
        theme === 'dark' ||
        ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const root = document.documentElement;
      root.classList.toggle('dark', isDark);
      root.style.colorScheme = isDark ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', isDark ? '#413a2c' : '#eae9e3');
      }
    </script>
    <script>
      // 旧版 Safari 等环境缺少的运行时 API 兜底。
      // 以内联经典脚本执行，保证早于所有 ES Module 依赖块生效。
      (function () {
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }
        var define = function (target, key, value) {
          Object.defineProperty(target, key, {
            value: value,
            writable: true,
            configurable: true,
            enumerable: false,
          });
        };
        if (typeof Object.hasOwn !== 'function') {
          define(Object, 'hasOwn', function (object, key) {
            return Object.prototype.hasOwnProperty.call(object, key);
          });
        }
        if (typeof Object.fromEntries !== 'function') {
          define(Object, 'fromEntries', function (iterable) {
            var result = {};
            var iterator = iterable[Symbol.iterator]();
            var step;
            while (!(step = iterator.next()).done) {
              result[step.value[0]] = step.value[1];
            }
            return result;
          });
        }
        var indexAt = function (length, index) {
          var k = Math.trunc(index) || 0;
          var i = k < 0 ? length + k : k;
          return i >= 0 && i < length ? i : -1;
        };
        if (typeof Array.prototype.at !== 'function') {
          define(Array.prototype, 'at', function (index) {
            var i = indexAt(this.length, index);
            return i === -1 ? undefined : this[i];
          });
        }
        if (typeof String.prototype.at !== 'function') {
          define(String.prototype, 'at', function (index) {
            var i = indexAt(this.length, index);
            return i === -1 ? undefined : this.charAt(i);
          });
        }
        var findLastIndex = function (predicate, thisArg) {
          for (var i = this.length - 1; i >= 0; i--) {
            if (predicate.call(thisArg, this[i], i, this)) {
              return i;
            }
          }
          return -1;
        };
        if (typeof Array.prototype.findLast !== 'function') {
          define(Array.prototype, 'findLast', function (predicate, thisArg) {
            var i = findLastIndex.call(this, predicate, thisArg);
            return i === -1 ? undefined : this[i];
          });
        }
        if (typeof Array.prototype.findLastIndex !== 'function') {
          define(Array.prototype, 'findLastIndex', findLastIndex);
        }
        if (typeof String.prototype.replaceAll !== 'function') {
          define(String.prototype, 'replaceAll', function (search, replacement) {
            if (search instanceof RegExp) {
              if (!search.global) {
                throw new TypeError('replaceAll must be called with a global RegExp');
              }
              return this.replace(search, replacement);
            }
            return this.split(String(search)).join(String(replacement));
          });
        }
        if (typeof Promise.allSettled !== 'function') {
          define(Promise, 'allSettled', function (promises) {
            return Promise.all(
              Array.prototype.map.call(promises, function (promise) {
                return Promise.resolve(promise).then(
                  function (value) {
                    return { status: 'fulfilled', value: value };
                  },
                  function (reason) {
                    return { status: 'rejected', reason: reason };
                  },
                );
              }),
            );
          });
        }
        if (typeof queueMicrotask !== 'function') {
          define(window, 'queueMicrotask', function (callback) {
            Promise.resolve().then(callback);
          });
        }
        if (typeof String.prototype.trimStart !== 'function') {
          define(String.prototype, 'trimStart', String.prototype.trimLeft);
          define(String.prototype, 'trimEnd', String.prototype.trimRight);
        }
      })();
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.9331 0.0081 98.8844);
        color: oklch(0.6205 0.1199 144.8607);
        transition: opacity 200ms ease;
      }
      html.dark #initial-loader {
        background: oklch(0.2809 0.0264 153.4040);
        color: oklch(0.6990 0.1292 144.8727);
      }
      #initial-loader.octo-hide {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader svg {
        width: 120px;
        height: 120px;
      }
      #initial-loader .octo-group {
        animation: octoFade 2s ease-in-out infinite;
      }
      #initial-loader path {
        fill: none;
        stroke: currentColor;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        opacity: 0;
      }
      #initial-loader .octo-outline {
        animation: octoDrawOuter 2s ease-in-out infinite both;
      }
      #initial-loader .octo-inner {
        animation: octoDrawInner 2s ease-in-out infinite both;
      }

      @keyframes octoDrawOuter {
        0%   { stroke-dashoffset: 1; opacity: 0; }
        4%   { opacity: 1; }
        28%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes octoDrawInner {
        0%   { stroke-dashoffset: 1; opacity: 0; }
        32%  { stroke-dashoffset: 1; opacity: 0; }
        34%  { stroke-dashoffset: 1; opacity: 1; }
        58%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes octoFade {
        0%   { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader .octo-group,
        #initial-loader path {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="initial-loader" role="status" aria-label="Loading">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g class="octo-group">
          <path class="octo-outline" pathLength="1" d="M20 90 Q30 90 30 83 Q30 80 27.88 77.88 C25 75 15 65 15 50 C15 30 30 15 50 15 C70 15 85 30 85 50 C85 65 75 75 72.12 77.88 Q70 80 70 83 Q70 90 80 90" />
          <path class="octo-inner" pathLength="1" d="M43 77 L43 85 C43 87.76 40.76 90 38 90" />
          <path class="octo-inner" pathLength="1" d="M62 90 C59.24 90 57 87.76 57 85 L57 77" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
