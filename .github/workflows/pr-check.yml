name: pr-check

on:
  push:
    branches:
      - feat/call-price-rate-limit
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: looplj/axonhub
          path: axonhub-dep
      - run: mkdir -p ../axonhub && cp -a axonhub-dep/. ../axonhub/
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Frontend build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Go tests
        run: go test -mod=mod ./...
      - name: Go build
        run: CGO_ENABLED=0 go build -mod=mod -buildmode=exe -tags=jsoniter -o build/octopus .
