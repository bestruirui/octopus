name: pr-check

on:
  push:
    branches:
      - feat/call-price-rate-limit
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout axonhub dependency
        uses: actions/checkout@v5
        with:
          repository: looplj/axonhub
          path: axonhub-dep

      - name: Place axonhub dependency for Go replace
        run: mkdir -p ../axonhub && cp -a axonhub-dep/. ../axonhub/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Go tests
        run: go test -mod=mod ./...

      - name: Go build
        run: CGO_ENABLED=0 go build -mod=mod -buildmode=exe -tags=jsoniter -o build/octopus .

      - name: Frontend build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: octopus-${{ github.sha }}
          path: |
            build/octopus
            static/out/**
          if-no-files-found: error
